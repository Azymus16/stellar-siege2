name: Build iOS (non signé)

# Se lance uniquement à la demande, depuis l'onglet "Actions" du repo GitHub
# (bouton "Run workflow"). Ne consomme donc des minutes macOS que quand on
# en a réellement besoin.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_DIR: "4.3.stable" # même version, mais Godot utilise un point au lieu d'un tiret

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Télécharger Godot (édition macOS)
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          chmod +x "Godot.app/Contents/MacOS/Godot"
          sudo mv Godot.app /Applications/Godot.app
          echo "GODOT_BIN=/Applications/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV

      - name: Télécharger les modules d'export (export templates)
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}"
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION_DIR}/"

      - name: Générer un preset d'export par défaut
        run: |
          "$GODOT_BIN" --headless --path . --generate-export-presets || true
          test -f export_presets.cfg || (echo "export_presets.cfg n'a pas été généré" && exit 1)
          cat export_presets.cfg

      - name: Configurer le preset iOS (identifiant, chemin de sortie)
        run: python3 tools/patch_export_presets.py

      - name: Exporter le projet Xcode depuis Godot
        run: |
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" build/ios/StellarSiege.xcodeproj
          ls -la build/ios

      - name: Détecter le scheme Xcode généré
        id: scheme
        run: |
          cd build/ios
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n1)
          echo "Projet détecté : $PROJECT_FILE"
          SCHEME=$(xcodebuild -list -project "$PROJECT_FILE" -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          echo "Scheme détecté : $SCHEME"
          echo "project_file=$PROJECT_FILE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Compiler un .app non signé (signature désactivée, Sideloadly s'en chargera)
        run: |
          cd build/ios
          xcodebuild \
            -project "${{ steps.scheme.outputs.project_file }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath xcbuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Empaqueter en .ipa non signé
        run: |
          cd build/ios/xcbuild/Build/Products/Release-iphoneos
          APP_DIR=$(find . -maxdepth 1 -name "*.app" | head -n1)
          echo "App trouvée : $APP_DIR"
          mkdir Payload
          cp -r "$APP_DIR" Payload/
          zip -qr "$GITHUB_WORKSPACE/StellarSiege-unsigned.ipa" Payload

      - name: Publier le .ipa en tant qu'artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: StellarSiege-ipa-non-signe
          path: StellarSiege-unsigned.ipa
          retention-days: 14
